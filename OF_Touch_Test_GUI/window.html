<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" type="text/css" href="resources/styles.css">
    </head>
    <body>
        <canvas id="canvas"></canvas>

        <div id="body_container">
            <div id="measurement">
                <div id="info">
                    Touch start/stop time: <span id="time"></span>
                    <br/><br/>
                    Resolution: <span id="resolution2"></span>
                    <br/><br/> 
                    Connection: <span id="connection"></span>
                    <br/><br/>
                    Touch with non measured device to stop measuring
                </div>
    
                <div id="latency"></div>
            </div>
            
            <div id="configuration">
                <h2>OptoFidelity Touch Tester</h2> <br/>
                Resolution:
                <br/>                   
                <div id="resolution">resolution</div>
                <br/>   
                IP: <br/> <input name="ip" type="text" value=""/>
                <br/>
                Port: <br/> <input name="port" type="number" value="" min="1" max="65535"/>
                <br/>
                Device: <br/> 
                <select id="devpaths">
                </select>

                <br/>
                <br/>
                <div id="errors">Launch Python test script</div>
                <br/>

                <button id="testing_btn" disabled>Start testing</button>
                <button id="latency_btn">Latency test</button>
                <button id="p2i_btn">Pen-to-Ink</button>

                <br/>
                <br/>
                <br/>
                <button id="exit_btn">Exit</button>
            </div>

            <br/>
            <br/>

            <div id="optofidelity">
                <div id="about">
                    <h2> <span id="app_name"></span> </h2>
                    <h3> Application version <span id="ver"></span></h3>
                    <br/>
                    <p>
                        <h2> Support </h2>
                        www.optofidelity.com
                        <br/>
                        <br/>
                        support@optofidelity.com
                    </p>
                </div>
                <h3 id="about_btn">About</h3>
                <img src="resources/optofidelity_logo.png" alt="Optofidelity" id="logo"></img>
            </div>
        </div>


        <script type="text/javascript" src="index.js"></script>
        <script type="text/javascript" src="resources/canvas.js"></script>
    </body>
</html>
